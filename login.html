<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mugen Esports Portal</title>
  <style>
    body {
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      text-align: center;
      box-sizing: border-box;
    }

    /* Tab Switcher Buttons */
    .tab-buttons {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #666666;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #666666;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s, border-bottom 0.2s;
    }

    .tab-btn.active {
      color: #1a1a1a;
      border-bottom: 3px solid #1a1a1a;
    }

    /* Form Styles */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .auth-form.hidden {
      display: none;
    }

    .auth-form h2 {
      margin: 0 0 10px 0;
      color: #1a1a1a;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #efefef;
      background-color: #d4d4d4;
      color: #1a1a1a;
      font-size: 14px;
      box-sizing: border-box;
      text-align: center;
    }

    input:focus {
      outline: 2px solid #1a1a1a;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: #1a1a1a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: #1a1a1a;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    
    <!-- Tab Navigation -->
    <div class="tab-buttons">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="form-login" class="auth-form">
      <h2>Welcome Back, Mugenites!</h2>
      <input type="email" id="login-email" placeholder="Email Address" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="btn-submit">Login</button>
    </form>

    <!-- REGISTER FORM (Hidden by default) -->
    <form id="form-register" class="auth-form hidden">
      <h2>Create Account</h2>
           <select id="team">
        <option value="MUGEN CAELITH SLAYERS">MUGEN CAELITH SLAYERS</option>
        <option value="MUGEN EL HOMBRE">MUGEN EL HOMBRE</option>
        <option value="MUGEN GULDATHINGS">MUGEN GULDATHINGS</option>
        <option value="MUGEN KISHIN">MUGEN KISHIN</option>
        <option value="MUGEN NEW ERA">MUGEN NEW ERA</option>
        <option value="MUGEN TEAM LEGACY MAIN">MUGEN TEAM LEGACY MAIN</option>
        <option value="MUGEN TEAM LEGACY 2.0">MUGEN TEAM LEGACY 2.0</option>
        <option value="MUGEN VARPEX CILLAGON">MUGEN VARPEX CILLAGON</option>
        <option value="MUGEN YAKUZA RANCOR">MUGEN YAKUZA RANCOR</option>
        <option value="ADMIN">ADMIN</option>
     </select>
      <input type="text" id="reg-name" placeholder="Full Name" required>
      <input type="text" id="ign" placeholder="In-Game Name" required>
      <input type="number" id="id" placeholder="ML ID" required>
      <input type="number" id="server" placeholder="Server" required>
      <input type="date" id="bdate" placeholder="Date of Birth" required>
      <input type="text" id="location" placeholder="Location (city/province only)" required>
      <input type="email" id="reg-email" placeholder="Email Address" required>
      <input type="password" id="reg-password" placeholder="Password (min 6 chars)" required>
      <button type="submit" class="btn-submit">Register</button>
    </form>

  </div>

  <!-- Tab Toggle Script -->
  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');
      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
      } else {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
      }
    }
  </script>

  <!-- Connect your Firebase JavaScript logic -->
  <script type="module" src="app.js"></script>
</body>
</html>
